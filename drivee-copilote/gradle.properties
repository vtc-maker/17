# Paramètres Gradle du projet Drivee Copilote.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# OBLIGATOIRE : utilisation des bibliothèques AndroidX (Compose, Room, Hilt...).
android.useAndroidX=true

# Style de code Kotlin officiel.
kotlin.code.style=official

# Génère uniquement les ressources R nécessaires (build plus rapide).
android.nonTransitiveRClass=true
